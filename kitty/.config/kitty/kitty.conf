
# ===== Font =====
font_family JetBrains Mono
font_size 12.5
disable_ligatures always

# ===== Window =====
remember_window_size yes
initial_window_width 1200
initial_window_height 750
window_padding_width 10
hide_window_decorations no
background_opacity 0.96

# ===== Colors =====

# ===== Scrolling =====
scrollback_lines 20000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0

# ===== Cursor =====
cursor_shape beam
cursor_blink_interval 0.5
enable_audio_bell no
visual_bell_duration 0

# ===== Clipboard =====
clipboard_control write-clipboard write-primary
copy_on_select clipboard
strip_trailing_spaces smart

# ===== Tabs =====
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1

# ===== Shell =====
shell_integration enabled

# ===== Performance =====
repaint_delay 8
input_delay 3

# ===== Keyboard shortcuts =====
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+shift+enter new_window
map ctrl+shift+f launch --type=overlay kitten search
map ctrl+shift+u kitten unicode_input

# ===== Split panes =====
# Панели одна над другой
map ctrl+shift+down launch --location=hsplit

# Панели рядом друг с другом
map ctrl+shift+backslash launch --location=vsplit

# ===== Navigate panes =====
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down

# ===== Tabs =====
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
